name: Build Docker Image
on:
  push:
    branches:
      - master
    paths:
      - 'Dockerfile.*'
jobs:
  build:
    if: github.repository == 'longhuan1999/reader-dev'
    strategy:
      matrix:
        include:
          - tag: ''
            dockerfile: 'source'
          - tag: 'openj9-'
            dockerfile: 'openj9'
          - tag: 'slim-'
            dockerfile: 'slim'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
        with:
          fetch-depth: 0
      
      - name: Get latest tag
        id: get_tag
        uses: WyriHaximus/github-action-get-previous-tag@v1
        with:
          fallback: 'v3.2.14'

      - name: Publish to Registry
        uses: elgohr/Publish-Docker-Github-Action@master
        with:
          name: endless084/reader
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          #snapshot: true
          tags: "${{ matrix.tag }}latest,${{ matrix.tag }}${{ steps.get_tag.outputs.tag }}"
          dockerfile: Dockerfile.${{ matrix.dockerfile }}
